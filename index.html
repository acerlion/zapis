<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Онлайн-запись для клиентов салонов и мастеров</title>
<meta name="description" content="Telegram-бот для записи клиентов: салоны, мастера маникюра, ресниц, бровей, массажа и барберы. Настройка удалённо.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an appointment book. Hero pairs the pitch with a live-looking booking chat;
   time slots in mono are the recurring motif; one sea-teal accent, amber only for "free slot". */
:root {
  --bg: #F4F7F8;
  --surface: #FFFFFF;
  --ink: #0F2733;
  --muted: #566B75;
  --line: #D6E1E5;
  --sea: #0B7480;
  --sea-ink: #FFFFFF;
  --sea-soft: #DDEFF1;
  --amber: #C9831C;
  --amber-soft: #FCEFD9;
  --chat-bg: #E4ECEF;
  --bubble: #FFFFFF;
  --taken: #B9C7CD;

  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;

  --radius: 14px;
  --wrap: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1820; --surface: #112430; --ink: #E4EEF1; --muted: #93A8B1; --line: #213C4C;
    --sea: #45BCC6; --sea-ink: #04222A; --sea-soft: #123A42; --amber: #F0B456; --amber-soft: #3A2B14;
    --chat-bg: #0E1E27; --bubble: #17303D; --taken: #3A5562; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1820; --surface: #112430; --ink: #E4EEF1; --muted: #93A8B1; --line: #213C4C;
  --sea: #45BCC6; --sea-ink: #04222A; --sea-soft: #123A42; --amber: #F0B456; --amber-soft: #3A2B14;
  --chat-bg: #0E1E27; --bubble: #17303D; --taken: #3A5562; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap {
  max-width: var(--wrap); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 54px); line-height: 1.08; font-weight: 700; }
h2 { font-size: clamp(24px, 3.4vw, 36px); line-height: 1.15; font-weight: 700; }
h3 { font-size: 17px; line-height: 1.3; font-weight: 500; }
p { margin: 0; }
.eyebrow {
  font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--sea);
}
.lead { font-size: 18px; color: var(--muted); max-width: 34em; }
:focus-visible { outline: 3px solid var(--sea); outline-offset: 3px; border-radius: 6px; }

/* header */
header { border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; text-decoration: none; min-width: 0; }
.brand-mark {
  height: 34px; padding: 0 8px; border-radius: 10px; background: var(--sea); color: var(--sea-ink);
  display: grid; place-items: center; font: 700 13px/1 var(--mono); flex: none;
}
.brand span:last-child { line-height: 1.25; }
.langs { display: flex; gap: 4px; flex: none; }
.langs button {
  font: 500 13px/1 var(--mono); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; text-transform: uppercase;
}
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* buttons */
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
  font: 700 16px/1 var(--body); padding: 16px 22px; border-radius: 12px; border: 1.5px solid transparent;
  transition: transform .15s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--sea); color: var(--sea-ink); }
.btn-ghost { border-color: var(--ink); color: var(--ink); background: transparent; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* hero */
.hero .wrap { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; padding-block: 64px 72px; }
.hero-copy { display: grid; gap: 22px; min-width: 0; }
.note { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.note b { color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }

/* chat mock */
.phone {
  background: var(--chat-bg); border-radius: 28px; padding: 18px; border: 1px solid var(--line);
  display: grid; gap: 10px; max-width: 420px; width: 100%; justify-self: center; min-width: 0;
}
.chat-head { display: flex; align-items: center; gap: 10px; padding: 2px 4px 8px; border-bottom: 1px solid var(--line); }
.chat-ava { width: 34px; height: 34px; border-radius: 50%; background: var(--amber-soft); display: grid; place-items: center; font-size: 17px; }
.chat-head b { font-size: 14px; display: block; }
.chat-head small { font-size: 12px; color: var(--sea); }
.bubble {
  background: var(--bubble); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; line-height: 1.45;
  max-width: 92%; box-shadow: 0 1px 0 var(--line);
}
.bubble.me { justify-self: end; background: var(--sea); color: var(--sea-ink); border-radius: 14px 14px 4px 14px; box-shadow: none; }
.kbd { display: grid; gap: 6px; margin-top: 8px; }
.kbd span { display: block; text-align: center; font-size: 13px; padding: 8px; border-radius: 8px; background: var(--sea-soft); color: var(--ink); font-weight: 500; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.slot {
  font: 500 13px/1 var(--mono); text-align: center; padding: 8px 0; border-radius: 8px;
  background: var(--amber-soft); color: var(--ink); border: 1px solid transparent;
}
.slot.taken { background: transparent; color: var(--taken); text-decoration: line-through; border-color: var(--line); }
.slot.pick { background: var(--amber); color: #1B1205; }
.notify {
  margin-top: 6px; background: var(--surface); border: 1px dashed var(--sea); border-radius: 12px; padding: 10px 12px;
  display: grid; gap: 2px; font-size: 13px;
}
.notify .eyebrow { font-size: 10px; }
.notify b { font-size: 14px; }

/* sections */
section { padding-block: 72px; }
.band { background: var(--surface); border-block: 1px solid var(--line); }
.sec-head { display: grid; gap: 14px; margin-bottom: 40px; max-width: 760px; }

.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px 40px; }
.feature { display: grid; gap: 8px; align-content: start; min-width: 0; padding-top: 18px; border-top: 2px solid var(--ink); }
.feature .t { font: 500 12px/1 var(--mono); color: var(--sea); }
.feature p { color: var(--muted); font-size: 15px; }

/* calculator */
.calc { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
.calc-copy { display: grid; gap: 16px; min-width: 0; }
.calc-box { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 20px; min-width: 0; }
.field { display: grid; gap: 8px; }
.field label { font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; }
.field output { font: 500 15px/1 var(--mono); color: var(--sea); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--sea); }
.result { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 6px; }
.result .big { font: 700 clamp(34px, 5vw, 46px)/1 var(--display); font-variant-numeric: tabular-nums; }
.result .vs { font-size: 14px; color: var(--muted); }

/* pricing */
.prices { display: grid; grid-template-columns: 1fr 1fr; max-width: 860px; gap: 20px; }
.price { border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 14px; align-content: start; background: var(--surface); min-width: 0; }
.price.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.price.main p { color: color-mix(in srgb, var(--bg) 75%, transparent); }
.price .amount { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.price .amount small { font: 500 15px/1 var(--body); opacity: .75; }
.price p { color: var(--muted); font-size: 15px; }
.price .save { font-weight: 700; font-size: 16px; color: var(--sea); }
.price.main .save { color: var(--amber); }
.price-foot { max-width: 860px; display: grid; gap: 16px; margin-top: 20px; }
.included { color: var(--muted); font-size: 15px; }
.badge { justify-self: start; font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 99px; background: var(--amber); color: #1B1205; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: s; }
.step { display: grid; gap: 10px; align-content: start; min-width: 0; }
.step::before {
  counter-increment: s; content: counter(s); font: 700 15px/1 var(--mono); width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; border: 1.5px solid var(--sea); color: var(--sea);
}
.step p { color: var(--muted); font-size: 15px; }

/* faq */
.faq { display: grid; gap: 0; max-width: 820px; }
details { border-bottom: 1px solid var(--line); padding-block: 18px; }
summary { cursor: pointer; font-weight: 700; font-size: 17px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font: 500 20px/1 var(--mono); color: var(--sea); flex: none; }
details[open] summary::after { content: "−"; }
details p { color: var(--muted); margin-top: 10px; max-width: 62ch; }

/* contact */
.contact .wrap { display: grid; gap: 24px; justify-items: start; }
.contact-card { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; font-size: 15px; color: var(--muted); }
.contact-card b { color: var(--ink); font: 500 16px/1 var(--mono); user-select: all; }
.contact-card b.contact-name { font: 700 18px/1 var(--body); user-select: auto; }
.copy { font: 500 13px/1 var(--body); border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 24px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 900px) {
  .hero .wrap, .calc { grid-template-columns: 1fr; gap: 40px; }
  .prices { grid-template-columns: 1fr; }
  .features { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  .hero .wrap { padding-block: 40px 48px; }
  section { padding-block: 52px; }
  .features, .steps { grid-template-columns: 1fr; }
  .brand { font-size: 14px; }
  .btn { width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<header>

const $$ = (s) => document.querySelectorAll(s);
let lang = "bg";

function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) { v = null; } return v; }

function apply(l) {
  lang = T[l] ? l : "bg";
  const d = T[lang];
  document.documentElement.lang = lang;
  $$("[data-i]").forEach((el) => {
    const v = d[el.dataset.i];
    if (v === undefined) return;
    el.innerHTML = v;
  });
  $$(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.title = d.brand;
  store("lang", lang);
  calc();
}

function calc() {
  const m = +document.getElementById("missed").value;
  const c = +document.getElementById("check").value;
  const p = +document.getElementById("lost").value;
  document.getElementById("missedOut").textContent = m;
  document.getElementById("checkOut").textContent = c + " €";
  document.getElementById("lostOut").textContent = p + "%";
  const loss = Math.round((m * 4.3 * c * p) / 100 / 5) * 5;
  document.getElementById("loss").textContent = loss.toLocaleString(lang === "uk" ? "uk-UA" : lang === "ru" ? "ru-RU" : "bg-BG");
}

const tgUrl = "https://t.me/" + CONFIG.telegram;
const demoUrl = "https://t.me/" + CONFIG.demoBot;
$$(".js-tg").forEach((a) => (a.href = tgUrl));
$$(".js-demo").forEach((a) => (a.href = demoUrl));
$$(".js-tg-text").forEach((el) => (el.textContent = "@" + CONFIG.telegram));
$$(".js-phone").forEach((el) => (el.textContent = CONFIG.phone));
$$(".js-name").forEach((el) => (el.textContent = CONFIG.name));
$$(".js-phone-row").forEach((el) => (el.hidden = !CONFIG.phone));

$$(".langs button").forEach((b) => b.addEventListener("click", () => apply(b.dataset.lang)));
["missed", "check", "lost"].forEach((id) => document.getElementById(id).addEventListener("input", calc));

document.getElementById("copyPhone").addEventListener("click", (e) => {
  const btn = e.currentTarget;
  const done = () => { btn.textContent = T[lang].copied; setTimeout(() => (btn.textContent = T[lang].copy), 1600); };
  Promise.resolve()
    .then(() => navigator.clipboard.writeText(CONFIG.phone))
    .then(done)
    .catch(() => {
      const r = document.createRange();
      r.selectNodeContents(document.querySelector(".js-phone"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
});

// Язык: из ссылки (#bg, #ru, #uk), затем сохранённый, затем язык браузера
const fromHash = location.hash.slice(1);
const fromNav = (navigator.language || "bg").slice(0, 2);
apply(T[fromHash] && fromHash !== "bg" ? fromHash : "ru");
